<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eboss brand</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --card-bg: #f8f8f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-icon, .cart-icon {
            font-size: 20px;
            cursor: pointer;
        }

        .logo {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
        }

        /* Slide-out Menu (Drawer) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            visibility: hidden;
            opacity: 0;
            transition: 0.3s ease;
            z-index: 1000;
        }

        .drawer-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: #ffffff;
            transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 25px rgba(0,0,0,0.05);
        }

        .drawer.active {
            left: 0;
        }

        .drawer-header {
            padding: 20px 25px;
            display: flex;
            justify-content: flex-start;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-close {
            font-size: 22px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .drawer-links {
            list-style: none;
            overflow-y: auto;
        }

        .drawer-links li a {
            display: block;
            padding: 18px 25px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 400;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .drawer-links li a:hover {
            background: var(--card-bg);
        }

        /* Hero Banner Section */
        .hero-banner {
            width: 100%;
            height: 320px;
            background: url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&q=80&w=1200') center/cover no-repeat;
            margin-bottom: 40px;
        }

        /* Section Title */
        .section-title {
            text-align: center;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Product Grid (Latest Collection) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            padding: 0 6% 80px 6%;
        }

        .product-card {
            cursor: pointer;
            text-align: left;
        }

        .product-img-box {
            background-color: var(--card-bg);
            height: 400px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img-box img {
            transform: scale(1.03);
        }

        .product-name {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .product-price {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Product Detail View Modal (Fiks si në foto) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 6px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .modal-close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .modal-title-price {
            margin-bottom: 25px;
        }

        .modal-title-price h2 {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .modal-title-price p {
            font-size: 16px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group select, .qty-container {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            background: #fff;
            font-size: 14px;
            border-radius: 4px;
            outline: none;
        }

        .qty-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 140px;
        }

        .qty-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 0 10px;
        }

        .add-to-cart-btn {
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .add-to-cart-btn:hover {
            background: #333;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-banner {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="menu-icon" onclick="toggleDrawer()">
            <i class="fa-solid fa-bars"></i>
        </div>
        <a href="#" class="logo">eBOSS</a>
        <div class="cart-icon" onclick="alert('Shporta juaj është boshe.')">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
    </header>

    <!-- Drawer Menu (Fiks si te fotoja e dyte) -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="sideDrawer">
        <div class="drawer-header">
            <button class="drawer-close" onclick="toggleDrawer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="drawer-links">
            <li><a href="#" onclick="filterProducts('all'); toggleDrawer();">Home</a></li>
            <li><a href="#" onclick="filterProducts('all'); toggleDrawer();">All Products</a></li>
            <li><a href="#" onclick="filterProducts('New Balance'); toggleDrawer();">New Balance</a></li>
            <li><a href="#" onclick="filterProducts('Adidas'); toggleDrawer();">Adidas</a></li>
            <li><a href="#" onclick="filterProducts('Nike'); toggleDrawer();">Nike</a></li>
            <li><a href="#" onclick="filterProducts('Puma'); toggleDrawer();">Puma</a></li>
            <li><a href="#" onclick="filterProducts('Asics'); toggleDrawer();">Asics</a></li>
            <li><a href="#" onclick="filterProducts('MiuMiu'); toggleDrawer();">MiuMiu</a></li>
            <li><a href="#" onclick="filterProducts('UGG'); toggleDrawer();">UGG</a></li>
        </ul>
    </div>

    <!-- Hero Banner (Vjeshta / Imazhi i parë) -->
    <div class="hero-banner"></div>

    <div class="section-title" id="sectionTitle">Latest Collection</div>

    <!-- Produktet -->
    <div class="product-grid" id="productGrid">
        <!-- Produkt 1 -->
        <div class="product-card" data-brand="UGG" onclick="openProductModal('Ugg Taz', 'ALL 6,000.00', 'https://images.unsplash.com/photo-1603808033192-082d6919d3e1?auto=format&fit=crop&q=80&w=800')">
            <div class="product-img-box">
                <img src="https://images.unsplash.com/photo-1603808033192-082d6919d3e1?auto=format&fit=crop&q=80&w=800" alt="Ugg Taz">
            </div>
            <div class="product-name">Ugg Taz</div>
            <div class="product-price">ALL 6,000.00</div>
        </div>

        <!-- Produkt 2 -->
        <div class="product-card" data-brand="Nike" onclick="openProductModal('On Cloud Sneaker', 'ALL 5,000.00', 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=800')">
            <div class="product-img-box">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=800" alt="On Cloud">
            </div>
            <div class="product-name">On Cloud Sneaker</div>
            <div class="product-price">ALL 5,000.00</div>
        </div>

        <!-- Produkt 3 -->
        <div class="product-card" data-brand="New Balance" onclick="openProductModal('New Balance 530', 'ALL 5,500.00', 'https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&q=80&w=800')">
            <div class="product-img-box">
                <img src="https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&q=80&w=800" alt="New Balance">
            </div>
            <div class="product-name">New Balance 530</div>
            <div class="product-price">ALL 5,500.00</div>
        </div>

        <!-- Produkt 4 -->
        <div class="product-card" data-brand="Adidas" onclick="openProductModal('Adidas Spezial', 'ALL 5,200.00', 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&q=80&w=800')">
            <div class="product-img-box">
                <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&q=80&w=800" alt="Adidas">
            </div>
            <div class="product-name">Adidas Spezial</div>
            <div class="product-price">ALL 5,200.00</div>
        </div>
    </div>

    <!-- Modal i Produktit / Add to Cart (Fiks si te fotoja e tretë) -->
    <div class="modal-overlay" id="productModal" onclick="closeModalOutside(event)">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeProductModal()"><i class="fa-solid fa-xmark"></i></button>
            <img class="modal-img" id="modalImg" src="" alt="Product">
            <div class="modal-title-price">
                <h2 id="modalTitle">Emri</h2>
                <p id="modalPrice">Çmimi</p>
            </div>

            <div class="form-group">
                <label>Size. *</label>
                <select id="sizeSelect">
                    <option value="">Select</option>
                    <option value="36">36</option>
                    <option value="37">37</option>
                    <option value="38">38</option>
                    <option value="39">39</option>
                    <option value="40">40</option>
                    <option value="41">41</option>
                    <option value="42">42</option>
                    <option value="43">43</option>
                    <option value="44">44</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantity *</label>
                <div class="qty-container">
                    <button class="qty-btn" onclick="decrementQty()">-</button>
                    <span id="qtyValue">1</span>
                    <button class="qty-btn" onclick="incrementQty()">+</button>
                </div>
            </div>

            <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Hapja dhe mbyllja e menusë anësore (Drawer)
        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.toggle('active');
            document.getElementById('drawerOverlay').classList.toggle('active');
        }

        // Filtra produktet sipas markës kur zgjidhet nga menuja
        function filterProducts(brand) {
            const cards = document.querySelectorAll('.product-card');
            const title = document.getElementById('sectionTitle');
            
            title.innerText = brand === 'all' ? 'Latest Collection' : brand;

            cards.forEach(card => {
                if (brand === 'all' || card.getAttribute('data-brand') === brand) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Hapja e modalit të produktit
        function openProductModal(title, price, imgSrc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('qtyValue').innerText = '1';
            document.getElementById('sizeSelect').value = '';
            document.getElementById('productModal').classList.add('active');
        }

        // Mbyllja e modalit
        function closeProductModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        function closeModalOutside(e) {
            if (e.target.id === 'productModal') {
                closeProductModal();
            }
        }

        // Menaxhimi i sasisë (Quantity + / -)
        function incrementQty() {
            let qty = document.getElementById('qtyValue');
            qty.innerText = parseInt(qty.innerText) + 1;
        }

        function decrementQty() {
            let qty = document.getElementById('qtyValue');
            let current = parseInt(qty.innerText);
            if (current > 1) {
                qty.innerText = current - 1;
            }
        }

        // Butoni Add to Cart
        function addToCart() {
            let size = document.getElementById('sizeSelect').value;
            if (!size) {
                alert('Ju lutemi zgjidhni masën (Size) para se të vazhdoni!');
                return;
            }
            alert('Produkti u shtua me sukses në shportë!');
            closeProductModal();
        }
    </script>
</body>
</html>
